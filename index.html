<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#133c4b"><title>御輿来 TERRACE | TERRACE HUB DEMO</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#173c4a;background:#f6f7f4}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#103c4a;color:white;padding:16px max(20px,calc((100% - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-weight:800;letter-spacing:.1em}.brand small{display:block;color:#e7c69a;font-size:10px;letter-spacing:.22em}header select{border:1px solid #78969e;background:#194d59;color:white;border-radius:8px;padding:8px}main{max-width:1100px;margin:auto;padding:28px 20px 70px}.lead{background:linear-gradient(120deg,#164e5d,#257d83);color:white;padding:30px;border-radius:22px;position:relative;overflow:hidden}.lead:after{content:"";position:absolute;right:-65px;top:-125px;width:320px;height:320px;border:60px solid #e6a755;border-radius:50%;opacity:.5}.lead>div{position:relative;z-index:1}.lead h1{font-size:clamp(25px,4vw,42px);margin:7px 0}.lead p{max-width:650px;line-height:1.8}.pill{display:inline-block;background:#f8ece1;color:#925331;padding:5px 10px;border-radius:99px;font-size:12px;font-weight:700}.lead .pill{background:#fff2e0}nav{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}nav button{border:1px solid #dde3e1;border-radius:9px;background:white;padding:11px 14px;color:#335763}nav button.active{background:#164e5d;color:white;border-color:#164e5d}.panel{background:white;border:1px solid #e5e9e6;border-radius:18px;padding:24px;margin:16px 0;box-shadow:0 8px 30px #173c4a07}.panel h2{margin:0 0 14px;font-size:22px}.muted{color:#637a83}.small{font-size:13px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:14px}.card{background:#fbfcfa;border:1px solid #e4ebe7;border-radius:14px;padding:18px;min-width:0}.card h3{margin:5px 0 9px}.card p{line-height:1.65}.card .meta{color:#687f87;font-size:12px}button.primary{background:#16596a;color:white;border:0;border-radius:10px;padding:10px 16px;font-weight:700}button.ghost{background:#fff;border:1px solid #bfd0d0;border-radius:10px;padding:10px 13px;color:#1c5562}button.warn{color:#b33333;border:1px solid #efcdcd;background:white;border-radius:9px;padding:9px 12px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.tag{font-size:12px;border:1px solid #d2e1df;border-radius:99px;padding:4px 9px;color:#286276;display:inline-block;margin:2px 3px 2px 0}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:6px;font-weight:650;font-size:13px}.field input,.field textarea,.field select{border:1px solid #cdd8d7;border-radius:9px;padding:12px;color:#1c424b;background:#fff;width:100%}.field textarea{min-height:110px;resize:vertical}.full{grid-column:1/-1}.notice{border-left:4px solid #df9752;padding:12px 16px;background:#fff6e9;border-radius:6px;margin:10px 0;color:#62472e}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}.stat{padding:19px;border-radius:12px;background:#eff6f4}.stat strong{display:block;font-size:30px;margin-top:5px}.empty{padding:30px;text-align:center;color:#607882;background:#f5f8f7;border-radius:12px}.hidden{display:none!important}footer{font-size:12px;text-align:center;padding:20px;color:#67818a}a{color:#167188}.divider{height:1px;background:#e5ece9;margin:16px 0}@media(max-width:600px){.panel{padding:17px}.lead{padding:22px}nav button{font-size:12px;padding:10px}header{padding:15px 20px}}
</style></head><body><header><div class="brand">OKOSHIKI TERRACE<small>TERRACE HUB · DEMO</small></div><label>表示モード <select id="role"><option value="user">利用者</option><option value="supporter">支援者</option><option value="admin">運営者（デモ）</option></select></label></header><main><section class="lead"><div><span class="pill">熊本県宇土市 · コンセプト検証版</span><h1>働く場所から、<br>つながりが生まれる場所へ。</h1><p>施設利用・専門家相談・地域のつながり・お知らせを一つに。御輿来 TERRACEのための試作アプリです。</p></div></section><div class="notice"><b>デモ環境：</b>登録はこのブラウザ内にのみ保存されます。実際の予約、投稿配信、決済、電子ロック連携は行われません。運営者モードは認証機能ではありません。</div><nav id="nav"></nav><div id="page"></div></main><footer>御輿来 TERRACE · 〒869-0431 熊本県宇土市本町4丁目42 カメヤ2階<br>掲載料金・日程は検討中の案です。 © TERRACE HUB DEMO</footer><script>
(()=>{'use strict';const key='terrace_hub_pages_demo_v2',today='2026-11-09';const seeds=[{id:'n1',title:'プレオープンに向けて準備中です',category:'施設情報',body:'2026年12月中のプレオープン、2027年1月の本オープンを目標に準備しています。日程は決定次第ご案内します。',date:today,published:true,pinned:true},{id:'n2',title:'専門家による予約制相談会を企画中',category:'相談会',body:'起業・広報・ブランド・融資補助金・AI/DXなどの相談会を検討しています。実施日時は今後お知らせします。',date:today,published:true,pinned:false}];let state;try{state=JSON.parse(localStorage.getItem(key))||{}}catch(e){state={}}state.news??=seeds;state.reservations??=[];state.consultations??=[];state.posts??=[];state.supporters??=[];let role='user',tab='home',editing=null;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(key,JSON.stringify(state));const uid=()=>String(Date.now())+Math.random().toString(36).slice(2,6);const btn=(label,action,kind='ghost')=>'<button class="'+kind+'" data-action="'+action+'">'+label+'</button>';const badge=t=>'<span class="tag">'+esc(t)+'</span>';const line=(label,v)=>'<p class="small"><b>'+label+': </b>'+esc(v)+'</p>';const date=d=>esc(d||today);const menus=[['home','ホーム'],['news','お知らせ'],['reserve','施設予約'],['advisor','専門家相談'],['connect','地域マッチング'],['support','応援・支援'],['impact','活動レポート']];const admin=['admin','運営管理'];const noticeList=(arr,manage=false)=>arr.length?'<div class="cards">'+arr.map(n=>'<article class="card">'+(n.pinned?'<span class="pill">固定表示</span> ':'')+badge(n.category)+'<p class="meta">'+date(n.date)+(manage?' · '+(n.published?'公開中':'下書き'):'')+'</p><h3>'+esc(n.title)+'</h3><p>'+esc(n.body).replace(/\n/g,'<br>')+'</p>'+(manage?'<div class="actions">'+btn('編集','edit:'+n.id)+btn(n.published?'下書きへ':'公開する','publish:'+n.id)+btn('削除','delete:'+n.id,'warn')+'</div>':'')+'</article>').join('')+'</div>':'<div class="empty">お知らせはありません</div>';function render(){const items=role==='admin'?[...menus,admin]:menus.filter(i=>role==='supporter'?['home','news','connect','support','impact'].includes(i[0]):true);if(!items.some(x=>x[0]===tab))tab='home';$('nav').innerHTML=items.map(([id,label])=>'<button data-tab="'+id+'" class="'+(tab===id?'active':'')+'">'+label+'</button>').join('');const publicNews=state.news.filter(n=>n.published).sort((a,b)=>Number(b.pinned)-Number(a.pinned)||String(b.date).localeCompare(String(a.date)));let out='';if(tab==='home'){out='<section class="panel"><h2>ようこそ、TERRACE HUBへ</h2><p class="muted">仕事をする、相談する、誰かとつながる。その入口をひとつに。</p><div class="cards">'+[['📅','施設を使う','コワーキング・別室の利用希望を登録','reserve'],['💬','相談する','起業・広報・デザイン・融資・AI/DX','advisor'],['🤝','地域とつながる','事業や仲間の募集・マッチング','connect']].map(x=>'<div class="card"><h3>'+x[0]+' '+x[1]+'</h3><p>'+x[2]+'</p>'+btn('見てみる','tab:'+x[3],'primary')+'</div>').join('')+'</div></section><section class="panel"><h2>📣 最新のお知らせ</h2>'+noticeList(publicNews.slice(0,3))+ '<div class="actions">'+btn('お知らせ一覧へ','tab:news')+'</div></section>';}else if(tab==='news'){out='<section class="panel"><h2>📣 お知らせ</h2><p class="muted">施設情報、相談会、イベント、地域の活動をお伝えします。</p>'+noticeList(publicNews)+'</section>';}else if(tab==='reserve'){out='<section class="panel"><h2>📅 施設利用の希望登録</h2><div class="notice">予約の確定や空き状況確認は行われないデモです。</div><div class="cards">'+[['コワーキング・1時間','400円（仮）'],['コワーキング・1日','1,500円（仮）'],['別室ミーティングルーム','料金調整中']].map(x=>'<div class="card"><h3>'+x[0]+'</h3><p>'+x[1]+'</p></div>').join('')+'</div><form id="reserveForm" class="fields" style="margin-top:20px"><label class="field">利用内容<select name="service"><option>コワーキング・1時間</option><option>コワーキング・1日</option><option>別室ミーティングルーム</option></select></label><label class="field">希望日<input name="date" type="date" required></label><label class="field">希望時間<input name="time" type="time" required></label><label class="field">人数<input name="people" type="number" min="1" max="20" value="1" required></label><label class="field full">備考<textarea name="note" placeholder="利用目的・希望など"></textarea></label><div>'+btn('希望をデモ登録','submit', 'primary')+'</div></form></section>';}else if(tab==='advisor'){out='<section class="panel"><h2>💬 専門家相談会</h2><p>隔週・予約制の現地相談会を計画中。日程は未確定です。</p><div class="cards">'+['起業・事業相談','広告・広報相談','ブランディング・デザイン','融資・補助金相談','AI・DX活用相談'].map(x=>'<div class="card"><h3>'+esc(x)+'</h3><p class="muted small">地域事業者・創業希望者向けの個別相談（企画中）</p></div>').join('')+'</div><form id="advisorForm" class="fields" style="margin-top:20px"><label class="field">相談テーマ<select name="topic">'+['起業・事業相談','広告・広報相談','ブランディング・デザイン','融資・補助金相談','AI・DX活用相談'].map(x=>'<option>'+x+'</option>').join('')+'</select></label><label class="field">希望時期<input name="date" type="date" required></label><label class="field full">相談内容<textarea name="body" required placeholder="具体的な課題"></textarea></label><div>'+btn('相談希望をデモ登録','submit','primary')+'</div></form></section>';}else if(tab==='connect'){out='<section class="panel"><h2>🤝 地域の困りごと・協力募集</h2><p class="muted">投稿は運営側による承認制です。デモでは運営モードで承認できます。</p><div class="cards">'+state.posts.filter(p=>p.approved).map(p=>'<div class="card">'+badge(p.category)+'<h3>'+esc(p.title)+'</h3><p>'+esc(p.body)+'</p></div>').join('')+'</div><form id="postForm" class="fields" style="margin-top:20px"><label class="field">カテゴリ<select name="category"><option>仕事の依頼</option><option>相談したい</option><option>仲間募集</option><option>地域活動</option></select></label><label class="field">募集タイトル<input name="title" required></label><label class="field full">内容<textarea name="body" required></textarea></label><div>'+btn('承認待ちとしてデモ登録','submit','primary')+'</div></form></section>';}else if(tab==='support'){out='<section class="panel"><h2>♡ 応援・支援者登録</h2><p>地域企業・個人の皆さまと、宇土の新たな交流拠点を育てていきます。</p><form id="supportForm" class="fields"><label class="field">支援者区分<select name="kind"><option>個人</option><option>法人・団体</option></select></label><label class="field">お名前・企業名<input name="name" required></label><label class="field full">応援したいこと<textarea name="message" required></textarea></label><div>'+btn('関心をデモ登録','submit','primary')+'</div></form></section>';}else if(tab==='impact'){const stats=[['施設利用希望',state.reservations.length],['相談希望',state.consultations.length],['地域募集',state.posts.filter(p=>p.approved).length],['支援関心',state.supporters.length],['公開お知らせ',publicNews.length]];out='<section class="panel"><h2>📊 TERRACE IMPACT</h2><p class="muted">この端末に記録されたデモ件数です。施設の実績ではありません。</p><div class="stats">'+stats.map(s=>'<div class="stat">'+s[0]+'<strong>'+s[1]+'</strong></div>').join('')+'</div></section>';}else if(tab==='admin'){out='<section class="panel"><h2>⚙️ お知らせ投稿・公開管理</h2><div class="notice">管理者ログインは未実装。デモの運営者切替は誰でも操作できます。</div><form id="newsForm" class="fields"><label class="field">カテゴリ<select name="category">'+['施設情報','相談会','イベント','地域情報','重要'].map(x=>'<option>'+x+'</option>').join('')+'</select></label><label class="field">掲載日<input name="date" type="date" value="'+today+'" required></label><label class="field full">タイトル<input name="title" required maxlength="100"></label><label class="field full">本文<textarea name="body" required maxlength="3000"></textarea></label><label class="field"><span>公開設定</span><select name="published"><option value="true">公開</option><option value="false">下書き</option></select></label><label class="field"><span>トップに固定</span><select name="pinned"><option value="false">固定しない</option><option value="true">固定する</option></select></label><div class="full actions"><button class="primary" type="submit" id="newsSave">お知らせを保存</button>'+btn('編集を取り消す','cancelEdit')+'</div></form></section><section class="panel"><h2>投稿一覧</h2>'+noticeList(state.news.sort((a,b)=>String(b.date).localeCompare(String(a.date))),true)+'</section><section class="panel"><h2>地域募集の承認管理</h2>'+(state.posts.length?state.posts.map(p=>'<div class="card"><h3>'+esc(p.title)+'</h3><p>'+esc(p.body)+'</p><p>'+badge(p.approved?'承認済':'承認待ち')+'</p>'+btn(p.approved?'非公開へ':'承認・公開','approve:'+p.id)+'</div>').join(''):'<p class="muted">投稿はありません。</p>')+'</section><section class="panel"><h2>デモ登録件数</h2><p>予約希望 '+state.reservations.length+'件 ／ 相談希望 '+state.consultations.length+'件 ／ 支援者関心 '+state.supporters.length+'件</p>'+btn('デモデータを書き出す','export')+'</section>';}$('page').innerHTML=out;if(tab==='admin'&&editing){const n=state.news.find(x=>x.id===editing);if(n){let f=$('newsForm');for(const k of ['title','body','category','date'])f.elements[k].value=n[k];f.elements.published.value=String(n.published);f.elements.pinned.value=String(n.pinned);$('newsSave').textContent='編集内容を保存'}}}
function go(t){tab=t;editing=null;render();window.scrollTo(0,0)}function submitRecord(form,id){const val=Object.fromEntries(new FormData(form));val.id=uid();val.created=new Date().toISOString();if(id==='postForm')val.approved=false;const bucket={reserveForm:'reservations',advisorForm:'consultations',postForm:'posts',supportForm:'supporters'}[id];state[bucket].push(val);save();form.reset();alert('デモ登録しました。このブラウザ内にのみ保存されます。');render()}
$('role').addEventListener('change',e=>{role=e.target.value;go('home')});$('nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)go(b.dataset.tab)});$('page').addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.id==='newsForm'){const v=Object.fromEntries(new FormData(f));v.published=v.published==='true';v.pinned=v.pinned==='true';if(editing){Object.assign(state.news.find(x=>x.id===editing),v)}else{state.news.unshift({...v,id:uid()})}editing=null;save();alert('デモ内に保存しました。ほかの端末には反映されません。');render()}else submitRecord(f,f.id)});$('page').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='submit'){const f=b.closest('form');f?.requestSubmit();return}if(a.startsWith('tab:'))return go(a.slice(4));if(a==='cancelEdit'){editing=null;return render()}if(a==='export'){const data=JSON.stringify(state,null,2),url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='terrace-hub-demo.json';link.click();URL.revokeObjectURL(url);return}const [verb,id]=a.split(':');const n=state.news.find(x=>x.id===id);if(verb==='approve'){let p=state.posts.find(x=>x.id===id);if(p){p.approved=!p.approved;save();render()}return}if(!n)return;if(verb==='edit'){editing=id;render();$('newsForm').scrollIntoView({behavior:'smooth'});return}if(verb==='delete'){if(confirm('削除しますか？')){state.news=state.news.filter(x=>x.id!==id);save();render()}return}if(verb==='publish'){n.published=!n.published;save();render()}});render();})();
</script></body></html>
